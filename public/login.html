<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuzion Cafe - Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f1eb;
    }

    .login-box {
      width: 500px;
      padding: 50px;
      background: white;
      border: 1px solid black;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
      color: #6b4226;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      font-size: larger;
      color: #777;
      margin-bottom: 30px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #6b4226;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #f06a1d;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      padding: 10px;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>FUZION</h1>
    <p class="subtitle">Cafe & Coffee</p>

    <h2>Admin Login</h2>

    <form id="loginForm">

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        required
      />

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      />

      <button type="submit">Login</button>

    </form>

    <div id="message"></div>

  </div>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {

        const response = await fetch("/api/auth/admin-login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        });

        const data = await response.json();

        message.style.display = "block";

        if (response.ok) {

          localStorage.setItem("token", data.token);
          localStorage.setItem("admin", JSON.stringify(data.admin));

          message.style.background = "#d4edda";
          message.style.color = "#155724";
          message.innerText = "Login successful!";

          setTimeout(() => {
            window.location.href = "/dashboard.html";
          }, 500);

        } else {

          message.style.background = "#f8d7da";
          message.style.color = "#721c24";
          message.innerText = data.message;

        }

      } catch (error) {

        message.style.display = "block";
        message.style.background = "#f8d7da";
        message.style.color = "#721c24";
        message.innerText = "Server connection failed.";

      }
    });
  </script>

</body>
</html>
