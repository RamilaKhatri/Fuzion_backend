<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fuzion Café - Reviews</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Admin CSS -->
    <link
        rel="stylesheet"
        href="/admin.css"
    >

</head>


<body>

<div class="layout">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <div class="brand">

            <span>FUZION</span>

            <small>CAFÉ ADMIN</small>

        </div>


        <nav class="sidebar-nav">

            <a href="/dashboard.html">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>


            <a href="/projects.html">
                <i class="fa-solid fa-folder-open"></i>
                <span>Projects</span>
            </a>


            <a href="/menu.html">
                <i class="fa-solid fa-utensils"></i>
                <span>Menu</span>
            </a>


            <a href="/users.html">
                <i class="fa-solid fa-users"></i>
                <span>Users</span>
            </a>


            <a href="/bookings.html">
                <i class="fa-solid fa-calendar-check"></i>
                <span>Bookings</span>
            </a>


            <a href="/enquiries.html">
                <i class="fa-solid fa-envelope"></i>
                <span>Enquiries</span>
            </a>


            <a href="/newsletter.html">
                <i class="fa-solid fa-envelope-open-text"></i>
                <span>Newsletter</span>
            </a>


            <a href="/orders.html">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Orders</span>
            </a>


            <a href="/gallery.html">
                <i class="fa-solid fa-images"></i>
                <span>Gallery</span>
            </a>


            <a href="/team.html">
                <i class="fa-solid fa-user-group"></i>
                <span>Team</span>
            </a>


            <!-- REVIEWS -->

            <a
                class="active"
                href="/reviews.html"
            >

                <i class="fa-solid fa-star"></i>

                <span>Reviews</span>

            </a>


            <a href="/profile.html">
                <i class="fa-solid fa-user-gear"></i>
                <span>Profile</span>
            </a>

        </nav>


        <div class="sidebar-bottom">

            <button
                class="logout"
                type="button"
                onclick="logout()"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>Logout</span>

            </button>

        </div>

    </aside>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">


        <!-- TOPBAR -->

        <div class="topbar">

            <div>

                <h1>
                    Customer Reviews
                </h1>

                <p class="muted">
                    View customer reviews and manage café replies.
                </p>

            </div>


            <button
                type="button"
                class="logout"
                onclick="logout()"
            >

                Logout

            </button>

        </div>



        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div
            id="message"
            class="message"
        ></div>



        <!-- =================================================
             REVIEW SUMMARY
        ================================================== -->

        <section class="panel">

            <div class="reviews-summary-grid">

                <div class="review-summary-card">

                    <div class="review-summary-icon">

                        <i class="fa-solid fa-comments"></i>

                    </div>

                    <div>

                        <span>
                            Total Reviews
                        </span>

                        <strong id="totalReviews">
                            0
                        </strong>

                    </div>

                </div>


                <div class="review-summary-card">

                    <div class="review-summary-icon">

                        <i class="fa-solid fa-star"></i>

                    </div>

                    <div>

                        <span>
                            Average Rating
                        </span>

                        <strong id="averageRating">
                            0.0
                        </strong>

                    </div>

                </div>


                <div class="review-summary-card">

                    <div class="review-summary-icon">

                        <i class="fa-solid fa-reply"></i>

                    </div>

                    <div>

                        <span>
                            Replied Reviews
                        </span>

                        <strong id="repliedReviews">
                            0
                        </strong>

                    </div>

                </div>

            </div>

        </section>



        <!-- =================================================
             ALL REVIEWS
        ================================================== -->

        <section class="panel">


            <div class="topbar">

                <div>

                    <h2>
                        All Reviews
                    </h2>

                </div>


                <button
                    type="button"
                    class="btn secondary"
                    id="refreshBtn"
                >

                    <i class="fa-solid fa-rotate"></i>

                    Refresh

                </button>

            </div>



            <!-- REVIEW LIST -->

            <div
                id="reviewsContainer"
                class="admin-reviews-grid"
            >

                <div class="admin-reviews-loading">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Loading reviews...

                </div>

            </div>

        </section>

    </main>

</div>



<!-- =====================================================
     COMMON JS
====================================================== -->

<script src="/admin-common.js"></script>


<!-- =====================================================
     REVIEWS JS
====================================================== -->

<script src="/reviews.js"></script>


</body>

</html>
