<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fuzion Café - Team</title>

    <link rel="stylesheet" href="/admin.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

<div class="layout">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <div class="brand">
            <span>FUZION</span>
            <small>CAFÉ ADMIN</small>
        </div>

        <nav class="sidebar-nav">

            <a href="/dashboard.html">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>

            <a href="/projects.html">
                <i class="fa-solid fa-folder-open"></i>
                <span>Projects</span>
            </a>

            <a href="/menu.html">
                <i class="fa-solid fa-utensils"></i>
                <span>Menu</span>
            </a>

            <a href="/users.html">
                <i class="fa-solid fa-users"></i>
                <span>Users</span>
            </a>

            <a href="/bookings.html">
                <i class="fa-solid fa-calendar-check"></i>
                <span>Bookings</span>
            </a>

            <a href="/enquiries.html">
                <i class="fa-solid fa-envelope"></i>
                <span>Enquiries</span>
            </a>

            <a href="/newsletter.html">
                <i class="fa-solid fa-envelope-open-text"></i>
                <span>Newsletter</span>
            </a>

            <a href="/orders.html">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Orders</span>
            </a>

            <a href="/gallery.html">
                <i class="fa-solid fa-images"></i>
                <span>Gallery</span>
            </a>

            <a class="active" href="/team.html">
                <i class="fa-solid fa-user-group"></i>
                <span>Team</span>
            </a>

            <a href="/profile.html">
                <i class="fa-solid fa-user-gear"></i>
                <span>Profile</span>
            </a>

        </nav>

        <div class="sidebar-bottom">

            <button
                class="logout"
                type="button"
                onclick="logout()"
            >
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </button>

        </div>

    </aside>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">

        <!-- TOP BAR -->

        <div class="topbar">

            <div>

                <h1>Team</h1>

                <p class="muted">
                    Add and manage Fuzion Café team members.
                </p>

            </div>

            <button
                type="button"
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>

        </div>


        <!-- =================================================
             ADD / EDIT TEAM MEMBER
        ================================================== -->

        <section class="panel">

            <h2 id="formTitle">
                Add Team Member
            </h2>

            <div
                id="message"
                class="message">
            </div>

            <form
                id="teamForm"
                class="form-grid"
            >

                <!-- NAME -->
<div class="field">

    <label>
        Name *
    </label>

    <input
        type="text"
        id="name"
        required
        placeholder="e.g. Anuj Sharma"
    >

</div>


<!-- POSITION -->
<div class="field">

    <label>
        Position *
    </label>

    <input
        type="text"
        id="position"
        required
        placeholder="e.g. Head Chef"
    >

</div>


<!-- IMAGE -->
<div class="field">

    <label>
        Team Image *
    </label>

    <input
        type="file"
        id="image"
        accept="image/jpeg,image/png,image/webp,image/jpg"
    >

</div>

                <!-- STATUS -->

                <div class="field">

                    <label>
                        Status
                    </label>

                    <select id="status">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <!-- ACTIONS -->

                <div class="actions full">

                    <button
                        class="btn primary"
                        type="submit"
                        id="saveButton"
                    >
                        Save
                    </button>

                    <button
                        class="btn secondary"
                        type="button"
                        onclick="resetTeamForm()"
                    >
                        Clear
                    </button>

                </div>

            </form>

        </section>


        <!-- =================================================
             ALL TEAM MEMBERS
        ================================================== -->

        <section class="panel">

            <div class="topbar">

                <h2>
                    All Team Members
                </h2>

                <button
                    type="button"
                    class="btn secondary"
                    onclick="loadTeamMembers()"
                >
                    Refresh
                </button>

            </div>


            <div class="table-wrap">

                <table class="table">

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Role</th>
                            <th>Image</th>
                            <th>Status</th>
                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody id="teamTableBody">

                        <tr>

                            <td
                                colspan="6"
                                class="empty"
                            >
                                Loading...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<script src="/admin-common.js"></script>

<script src="/team.js"></script>

</body>

</html>
